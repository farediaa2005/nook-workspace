@if (isOpen()) {
      <div class="modal-backdrop" (click)="closed.emit()" role="presentation">
        <div class="modal-content" (click)="$event.stopPropagation()" role="presentation">
          <header class="modal-header">
            <h3>{{ title() }}</h3>
            <button class="close-btn" (click)="closed.emit()">&times;</button>
          </header>
          <div class="modal-body">
            <ng-content></ng-content>
          </div>
        </div>
      </div>
    }
