@if (isOpen()) {
      <div class="dialog-backdrop">
        <div class="dialog-content">
          <h4>{{ title() }}</h4>
          <p>{{ message() }}</p>
          <div class="actions">
            <button (click)="cancel.emit()">Cancel</button>
            <button class="confirm-btn" (click)="confirm.emit()">Confirm</button>
          </div>
        </div>
      </div>
    }
