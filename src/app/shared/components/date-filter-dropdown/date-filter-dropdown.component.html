<div class="date-filter-wrapper">
  <!-- Trigger Button -->
  <button
    type="button"
    class="date-filter-dropdown"
    [class.date-filter-dropdown--active]="isOpen()"
    (click)="toggleDropdown()"
  >
    <svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span class="date-display-text">{{ getDisplayLabel() }}</span>
    <svg
      class="chevron-icon"
      [class.chevron-icon--rotated]="isOpen()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <!-- Dropdown Menu Popup -->
  @if (isOpen()) {
    <div class="menu-backdrop" (click)="closeDropdown()"></div>
    <div class="date-menu-card">
      <button
        type="button"
        class="date-menu-item"
        [class.date-menu-item--active]="selectedOption() === 'today'"
        (click)="selectOption('today')"
      >
        {{ getTodayMenuLabel() }}
      </button>

      <button
        type="button"
        class="date-menu-item"
        [class.date-menu-item--active]="selectedOption() === 'yesterday'"
        (click)="selectOption('yesterday')"
      >
        {{ getYesterdayMenuLabel() }}
      </button>

      <button
        type="button"
        class="date-menu-item"
        [class.date-menu-item--active]="selectedOption() === 'all'"
        (click)="selectOption('all')"
      >
        {{ t().allDates }}
      </button>

      <div class="date-menu-divider"></div>

      <div class="date-custom-picker">
        <label class="custom-date-label">{{ t().pickCustomDate }}</label>
        <input
          type="date"
          class="custom-date-input"
          [value]="customDate()"
          [max]="maxDate() || todayDateIso()"
          (change)="onCustomDateInput($any($event.target).value)"
        />
      </div>
    </div>
  }
</div>
